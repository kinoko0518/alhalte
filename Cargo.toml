[workspace]
resolver = "3"
members = ["canner","maitred"]

[workspace.dependencies]
uuid = { version = "1.29.0", features = ["v7"] }
tokio = { version = "1.54.1", features = ["full"] }
blake3 =  "1.8.7"
aes-gcm-siv = "0.12.1"
brotli = "9.1.0"
zstd = "0.14.3"
canner.path = "canner"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "uuid"
] }
hex = "0.4.3"
toml = "1.1.8"
const_format = "0.2.37"
